name: Apple Silicon
on:
  push:
    branches: [main, codex/apple-silicon]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-macos:
    runs-on: macos-14
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 3
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify native Apple Silicon runner
        run: |
          test "$(uname -m)" = arm64
          sw_vers
          sysctl -n machdep.cpu.brand_string
          rustc -vV
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Compile workspace tests on macOS
        timeout-minutes: 20
        run: cargo test --workspace --locked --no-run
      - name: Run workspace tests on macOS
        timeout-minutes: 5
        run: cargo test --workspace --locked
      - name: Build the native installer artifact
        timeout-minutes: 25
        run: |
          cargo build --release --locked -p jj-tandem --bin tandem
          mkdir -p artifacts
          cp target/release/tandem artifacts/td-aarch64-apple-darwin
          file artifacts/td-aarch64-apple-darwin
          otool -L artifacts/td-aarch64-apple-darwin
          vtool -show-build artifacts/td-aarch64-apple-darwin
          artifacts/td-aarch64-apple-darwin --version
          shasum -a 256 artifacts/td-aarch64-apple-darwin > artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: td-aarch64-apple-darwin
          path: artifacts/
          if-no-files-found: error
