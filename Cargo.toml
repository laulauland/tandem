[workspace]
members = ["crates/*", "testing/*"]
default-members = ["crates/cli"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/laulauland/tandem"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
blake2 = "0.10"
gix-hash = "0.22"
gix-object = "0.55"
dunce = "1"
libc = "0.2"
hyper-util = { version = "0.1", features = ["client-legacy"] }
object_store = { version = "0.14.1", features = ["aws"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
jj-lib = { version = "0.38.0", features = ["git"] }
prost = "0.14"
smallvec = "1"
async-trait = "0.1"
futures = "0.3"
reqwest = { version = "0.13", features = ["blocking", "json"] }
tracing = "0.1"
axum = "0.8"
tower = "0.5"
clap = { version = "4", features = ["derive", "env"] }
jj-cli = { version = "0.38.0", default-features = false, features = ["git"] }
notify = "8"
pollster = "0.4"
rand = "0.9"
tokio-stream = { version = "0.1", features = ["sync"] }
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "registry"] }
url = "2"

jj-tandem-protocol = { package = "jj-tandem-protocol", path = "crates/protocol", version = "0.4.0" }
jj-tandem-wal = { package = "jj-tandem-wal", path = "crates/wal", version = "0.4.0" }
jj-tandem-storage = { package = "jj-tandem-storage", path = "crates/storage", version = "0.4.0" }
jj-tandem-jj = { package = "jj-tandem-jj", path = "crates/jj-interop", version = "0.4.0" }
jj-tandem-client = { package = "jj-tandem-client", path = "crates/client", version = "0.4.0" }
jj-tandem-workspace = { package = "jj-tandem-workspace", path = "crates/workspace", version = "0.4.0" }
jj-tandem-repository = { package = "jj-tandem-repository", path = "crates/repository", version = "0.4.0" }
jj-tandem-server = { package = "jj-tandem-server", path = "crates/server", version = "0.4.0" }
jj-tandem-test-support = { package = "jj-tandem-test-support", path = "testing/test-support" }


[workspace.lints.rust]
unused_must_use = "warn"

# Optimize heavy dependencies while keeping local workspace rebuilds quick.
[profile.dev.package."*"]
opt-level = 2
